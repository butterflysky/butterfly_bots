[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "butterfly-bot"
version = "0.1.0"
description = "Shared Discord bot behavior"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.6,<3",
    "openai>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["butterfly_bot"]
